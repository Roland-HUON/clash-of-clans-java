services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coc
      POSTGRES_USER: coc
      POSTGRES_PASSWORD: coc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coc -d coc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    profiles: ["full"]
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coc
      SPRING_DATASOURCE_USERNAME: coc
      SPRING_DATASOURCE_PASSWORD: coc
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

volumes:
  postgres-data:
