<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash of Clans — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  body { display: grid; place-items: center; overflow: auto; }
  .gate {
    width: min(380px, 92vw); text-align: center;
    background: linear-gradient(var(--parchment), var(--parchment-dark));
    border: 6px solid var(--stroke); border-radius: 24px; padding: 28px 26px;
    box-shadow: var(--shadow);
  }
  .gate .crest { width: 58px; height: 66px; margin-bottom: 6px; }
  .gate h1 {
    font-size: 26px; color: var(--gold); -webkit-text-stroke: 3px var(--stroke);
    paint-order: stroke fill; text-shadow: 0 3px 0 var(--gold-dark); margin-bottom: 2px;
  }
  .gate p.sub { margin: 0 0 18px; font-weight: 800; font-size: 12px; letter-spacing: 1.6px;
                text-transform: uppercase; color: var(--ink-soft); }
  .gate label { display: block; text-align: left; font-size: 12px; font-weight: 800;
                text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); margin: 12px 0 4px; }
  .gate input {
    width: 100%; font-family: inherit; font-weight: 800; font-size: 15px;
    padding: 9px 11px; border: 3px solid var(--stroke); border-radius: 10px; background: #fff;
  }
  .gate .btn-attack { margin-top: 20px; }
  .note { margin-top: 16px; font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.5; }
  .note code { background: #00000012; padding: 1px 5px; border-radius: 5px; font-weight: 800; }
  .alert { margin: 0 0 12px; padding: 8px 10px; border-radius: 10px; border: 3px solid var(--stroke);
           font-weight: 800; font-size: 13px; }
  .alert.bad { background: linear-gradient(#ffb3ad, #e8837b); }
  .alert.good { background: linear-gradient(#bdf0bd, #8ad68a); }
  .alert[hidden] { display: none !important; }
</style>
</head>
<body>

<main class="gate">
  <svg class="crest" viewBox="0 0 64 72" aria-hidden="true">
    <path d="M32 2 60 12v28c0 16-12 26-28 30C16 66 4 56 4 40V12z" fill="#c9922f" stroke="#40260f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M32 8 54 16v24c0 13-9 21-22 24C19 61 10 53 10 40V16z" fill="#f3d27a" stroke="#8a6320" stroke-width="2"/>
    <path d="M22 44V28l6 8 4-12 4 12 6-8v16z" fill="#7a3b1f" stroke="#40260f" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>

  <h1>Clash of Clans</h1>
  <p class="sub">Java engine</p>

  <div id="failed" class="alert bad" hidden>Wrong chief name or password.</div>
  <div id="loggedOut" class="alert good" hidden>You are signed out.</div>

  <form method="post" action="login">
    <label for="username">Chief</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <input type="hidden" id="csrf" name="_csrf">
    <button type="submit" class="btn btn-attack">Sign in</button>
  </form>

  <p class="note">
    Two chiefs ship with the application:
    <code>user</code> / <code>password</code> and <code>admin</code> / <code>admin</code>.
    Only an admin may delete anything.
  </p>
</main>

<script>
  const cookie = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
  if (cookie) document.getElementById('csrf').value = decodeURIComponent(cookie[1]);

  const query = new URLSearchParams(window.location.search);
  if (query.has('error')) document.getElementById('failed').hidden = false;
  if (query.has('logout')) document.getElementById('loggedOut').hidden = false;
</script>

</body>
</html>
